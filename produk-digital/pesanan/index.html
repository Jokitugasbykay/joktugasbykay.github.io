<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detail pesanan · JOKI.IN</title>
<style>
:root{color-scheme:dark;--bg:#0b1214;--panel:#10191b;--line:#34474c;--text:#f4f7f6;--muted:#b1bfc2;--mint:#50e2bd}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 "Plus Jakarta Sans",system-ui,sans-serif}
.wrap{width:min(1100px,calc(100% - 48px));margin-inline:auto}header{border-bottom:1px solid var(--line);padding:18px 0}
.brand{font-size:24px;font-weight:850;letter-spacing:-.04em;color:var(--text);text-decoration:none}.brand span,.eyebrow,a{color:var(--mint)}
main{padding:32px 0 56px}.eyebrow{font-size:.75rem;font-weight:750;letter-spacing:.09em;text-transform:uppercase;margin:0 0 4px}
h1{font-size:clamp(1.65rem,4vw,2.2rem);margin:0 0 22px;letter-spacing:-.035em}h2{font-size:1.05rem;margin:0 0 10px}
p{margin:0}.notice{display:flex;gap:8px 18px;flex-wrap:wrap;align-items:center;padding:13px 17px;border:1px solid var(--line);border-radius:10px;margin-bottom:20px;background:var(--panel)}
.notice[data-state=CANCELED]{background:#2b1b1d;border-color:#824b50}.notice[data-state=PAID] strong{color:var(--mint)}.notice[data-state=PENDING] strong{color:#f4d390}
.notice span,.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:20px;align-items:start}.panel{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.code{display:block;overflow-wrap:anywhere;font-size:clamp(1rem,2.4vw,1.3rem);font-weight:800}
.details,.total{border-top:1px solid var(--line);margin-top:18px;padding-top:16px}.details .row+.row{margin-top:13px}.row > :first-child{min-width:0;overflow-wrap:anywhere}.details .row strong{text-align:right;overflow-wrap:anywhere}.total strong{white-space:nowrap}
.total{font-weight:750}.actions{display:grid;gap:10px;margin-top:18px}.button{box-sizing:border-box;display:inline-flex;justify-content:center;align-items:center;min-height:44px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--text);padding:8px 14px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}.primary{color:#08221b;background:var(--mint);border-color:var(--mint)}.back{justify-self:start;padding:8px 0}.copy{color:var(--mint);flex:none}.feedback{font-size:.875rem;min-height:1.4em;margin-top:6px}
:focus-visible{outline:2px solid var(--mint);outline-offset:3px}[hidden]{display:none!important}
@media(max-width:680px){.wrap{width:calc(100% - 32px)}main{padding-top:24px}.grid{grid-template-columns:1fr;gap:14px}.panel{padding:16px}.notice{margin-bottom:14px}.notice span{flex-basis:100%}}
</style>
<link rel="stylesheet" href="/produk-digital/giant-duck.css?v=store2"><link rel="stylesheet" href="/produk-digital/site-shell.css"><script defer src="/produk-digital/site-shell.js"></script></head>
<body>
<header class="pd-site-header"><div class="pd-site-header-inner"><a class="pd-site-brand" href="/produk-digital/" aria-label="JOKI.IN Digital Store"><img src="/assets/produk-digital/jokiin-logo-white.png" alt="JOKI.IN"><span>Digital Store</span></a><nav aria-label="Navigasi produk digital"><a href="/produk-digital/">Katalog</a><a href="/">Beranda</a></nav></div></header>
<main class="wrap">
  <p class="eyebrow">Pesanan produk digital</p>
  <h1>Detail pesanan</h1>
  <div class="notice" id="notice" role="status"><span class="pd-duck" id="order-loader" aria-hidden="true"></span><strong id="status">Memeriksa status pesanan…</strong><span id="message"></span></div>
  <div class="grid">
    <section class="panel" id="receipt" aria-label="Rincian pesanan" hidden>
      <div class="row"><div><span class="muted">Kode pesanan</span><strong class="code" id="code"></strong></div><button class="button copy" id="copy" type="button">Salin</button></div>
      <p class="feedback muted" id="copy-feedback" role="status" hidden></p>
      <div class="details" id="details"></div>
      <div class="row total"><span>Total pesanan</span><strong id="total"></strong></div>
    </section>
    <section class="panel" aria-labelledby="payment-title">
      <h2 id="payment-title">Pembayaran</h2>
      <p class="muted" id="guidance">Status pembayaran sedang diperiksa.</p>
      <div class="actions">
        <a class="button primary" id="payment" hidden></a>
        <button class="button" id="refresh" type="button" hidden>Perbarui status pembayaran</button>
        <a class="back" href="/produk-digital">Kembali ke etalase</a>
      </div>
    </section>
  </div>
</main>
<script type="module">
const el = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const code = params.get('order') || params.get('order_code');
const rupiah = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 });
function tokenFrom(value) {
  if (!value) return null;
  try {
    const decoded = decodeURIComponent(value);
    if (decoded.startsWith('{') || decoded.startsWith('[')) return JSON.parse(decoded)?.access_token || null;
    return decoded;
  } catch { return null; }
}
function accessToken() {
  const cookie = document.cookie.match(/(?:^|;\s*)(?:sb-access-token|sb-[a-z0-9]+-auth-token)=([^;]+)/i);
  const token = tokenFrom(cookie?.[1]);
  if (token) return token;
  try {
    for (const key of Object.keys(localStorage)) {
      if (!key.includes('auth-token')) continue;
      const stored = tokenFrom(localStorage.getItem(key));
      if (stored) return stored;
    }
  } catch {}
  return null;
}
function detail(label, value) {
  const row = document.createElement('div');
  row.className = 'row';
  const text = document.createElement('span');
  const amount = document.createElement('strong');
  text.textContent = label;
  amount.textContent = value;
  row.append(text, amount);
  el('details').append(row);
}
function showOrder(order) {
  const state = order.payment_status;
  const statuses = {
    PAID: ['Pembayaran berhasil', 'Pembayaran sudah dikonfirmasi.'],
    PENDING: ['Menunggu pembayaran', 'Perbarui status setelah menyelesaikan pembayaran.'],
    CANCELED: ['Pembayaran belum berhasil', 'Pesanan ini belum diproses.']
  };
  const [status, message] = statuses[state] || ['Status belum tersedia', 'Perbarui status untuk memeriksa kembali.'];
  el('notice').dataset.state = state || '';
  el('status').textContent = status;
  el('message').textContent = message;
  el('code').textContent = order.order_code || code;
  el('details').replaceChildren();
  for (const item of order.items || []) {
    detail((item.name || item.produk || 'Produk digital') + ' × ' + (item.quantity ?? item.qty ?? 1), rupiah.format(item.total_price ?? item.subtotal ?? 0));
  }
  const buyer = order.nama || order.customer_name;
  if (buyer) detail('Pembeli', buyer);
  el('total').textContent = rupiah.format(order.total ?? order.total_price ?? 0);
  el('receipt').hidden = false;
  el('guidance').textContent = state === 'CANCELED' ? 'Mulai checkout baru untuk mencoba lagi.' : message;
  const payment = el('payment');
  const item = order.items?.[0];
  if (state === 'CANCELED' && item?.slug) {
    const query = new URLSearchParams({ slug: item.slug, qty: item.quantity ?? item.qty ?? 1 });
    payment.href = '/produk-digital/checkout/?' + query;
    payment.textContent = 'Coba checkout lagi';
    payment.hidden = false;
  } else if (state === 'PENDING' && /^https:\/\//i.test(order.payment_url || '')) {
    payment.href = order.payment_url;
    payment.textContent = 'Lanjutkan ke Mayar';
    payment.hidden = false;
  }
  el('refresh').hidden = state === 'PAID' || state === 'CANCELED';
}
async function load() {
  el('refresh').disabled = true;
  el('order-loader').hidden = false;
  el('receipt').hidden = true;
  el('payment').hidden = true;
  el('notice').dataset.state = '';
  el('status').textContent = 'Memeriksa status pesanan…';
  el('message').textContent = '';
  try {
    if (!code) throw new Error('Kode pesanan tidak ditemukan di URL.');
    const token = accessToken();
    const response = await fetch('/api/digital-store/orders/' + encodeURIComponent(code), {
      headers: token ? { Authorization: 'Bearer ' + token } : {},
      signal: AbortSignal.timeout(15000)
    });
    const data = await response.json();
    if (!response.ok || !data.ok || !data.order) throw new Error(data.error || 'Pesanan tidak ditemukan.');
    showOrder(data.order);
  } catch (error) {
    el('status').textContent = 'Status pesanan tidak dapat dimuat';
    el('message').textContent = error.name === 'TimeoutError' ? 'Permintaan terlalu lama. Coba perbarui status.' : error.message;
    el('guidance').textContent = code ? 'Coba perbarui status pesanan.' : 'Buka halaman ini dari tautan pesananmu.';
    el('refresh').hidden = !code;
  } finally {
    el('order-loader').hidden = true;
    el('refresh').disabled = false;
  }
}
el('refresh').addEventListener('click', load);
el('copy').addEventListener('click', async () => {
  const feedback = el('copy-feedback');
  try {
    await navigator.clipboard.writeText(el('code').textContent);
    feedback.textContent = 'Kode pesanan disalin.';
  } catch {
    feedback.textContent = 'Kode tidak bisa disalin otomatis. Pilih dan salin kode pesanan.';
  }
  feedback.hidden = false;
});
load();
</script>
</body>
</html>
